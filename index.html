function renderOverview(){
  const box=document.getElementById('overview-map');
  const note=document.getElementById('map-note');

  if(!window.L){
    note.textContent='Carte indisponible (Leaflet non chargé — vérifiez la connexion).';
    note.classList.remove('hidden');
    return;
  }

  if(!overviewMap){
    overviewMap=L.map(box).setView([44.559,6.079],12); // Gap par défaut
    const plan   = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'});
    const sat    = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Imagerie © Esri, Maxar, Earthstar Geographics'});
    const topo   = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:19,maxNativeZoom:17,attribution:'© OpenTopoMap (CC-BY-SA), © OpenStreetMap'});
    plan.addTo(overviewMap);

    // helpers Géoplateforme IGN (fiables)
    const geopfWMTS=(layer,fmt)=>L.tileLayer(
      `https://data.geopf.fr/wmts?SERVICE=WMTS&VERSION=1.0.0&REQUEST=GetTile&LAYER=${layer}&STYLE=normal&TILEMATRIXSET=PM&FORMAT=${fmt||'image/png'}&TILEMATRIX={z}&TILECOL={x}&TILEROW={y}`,
      {maxZoom:20,maxNativeZoom:19,attribution:'IGN — Géoplateforme'});
    const wms=(url,layers,attr)=>L.tileLayer.wms(url,{layers,format:'image/png',transparent:true,version:'1.3.0',attribution:attr||''});

    // fonds IGN supplémentaires
    const ortho   = geopfWMTS('ORTHOIMAGERY.ORTHOPHOTOS','image/jpeg');
    const planIgn = geopfWMTS('GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2','image/png');

    // surcouches
    const cadastre = geopfWMTS('CADASTRALPARCELS.PARCELLAIRE_EXPRESS','image/png');
    const pentes   = geopfWMTS('GEOGRAPHICALGRIDSYSTEMS.SLOPES.MOUNTAIN','image/png'); pentes.setOpacity(0.6);
    const admin    = wms('https://data.geopf.fr/wms-r/wms','ADMINEXPRESS-COG-CARTO.LATEST','IGN');
    const geol     = wms('https://geoservices.brgm.fr/geologie','GEOLOGIE','BRGM');

    const layerCtrl = L.control.layers(
      {'Plan':plan,'Satellite':sat,'Topographique':topo,'Ortho IGN':ortho,'Plan IGN':planIgn},
      {
        'Cadastre (IGN)':cadastre,
        'Pentes (IGN)':pentes,
        'Limites communes (IGN)':admin,
        'Géologie BRGM (test)':geol
      },
      {position:'topright'}
    ).addTo(overviewMap);
    overviewLayer=L.layerGroup().addTo(overviewMap);
    overviewMap.on('popupopen', onPopupOpen);
    initDrawTools(overviewMap, layerCtrl);
  }
  overviewLayer.clearLayers();

  const list=affaires.filter(a=>matchesFilters(a) && a.adresse && a.adresse.lat!=null);
  if(list.length===0){
    note.textContent=(activeEtats.size===ETATS.length && !searchTerm)
      ? 'Aucune affaire géolocalisée pour le moment.'
      : 'Aucune affaire géolocalisée avec ce filtre.';
    note.classList.remove('hidden');
    setTimeout(()=>overviewMap.invalidateSize(),60);
    return;
  }
  note.classList.add('hidden');

  const pts=[];
  for(const a of list){
    const mk = L.marker([a.adresse.lat,a.adresse.lng],{icon:pinIcon(pinColor(a.etat,a.repondu,a.avalider), pinSymbol(a))})
      .addTo(overviewLayer)
      .bindPopup(overviewPopup(a));
    mk._affaire = a;              // pour récupérer la météo au clic
    pts.push([a.adresse.lat,a.adresse.lng]);
  }
  setTimeout(()=>{ overviewMap.invalidateSize(); overviewMap.fitBounds(pts,{padding:[45,45],maxZoom:16}); },60);
}

/* ---------- Agenda : jalons datés non répondus, triés autour de l'échéance ---------- */
function renderAgenda(){
  const wrap=document.getElementById('agenda'); wrap.innerHTML='';
  const today=new Date(); today.setHours(0,0,0,0);
  const dOf=a=>{ const d=new Date(a.echeance+'T00:00:00'); d.setHours(0,0,0,0); return d; };
  const CLOSED=new Set(["Sans suite","Terminé"]);
  const items=affaires.filter(a=>a.echeance && !a.repondu && !CLOSED.has(a.etat)
    && (a.etat==="Appel d'offre" ? (aoMode!==3 && aoMode!==4) : activeEtats.has(a.etat)));

  if(items.length===0){
    wrap.append(el('div',{class:'agenda-empty'},
      "Aucune échéance en attente. Ajoutez une date d'échéance à une affaire non répondue pour la voir apparaître ici."));
    return;
  }

  const upcoming=items.filter(a=>dOf(a)>=today).sort((x,y)=>dOf(x)-dOf(y)); // plus urgent en haut
  const overdue =items.filter(a=>dOf(a)<today).sort((x,y)=>dOf(y)-dOf(x));  // le plus récent dépassé près de la ligne

  const list=el('div',{class:'agenda-list'});
  if(upcoming.length) list.append(el('div',{class:'agenda-head'}, 'À traiter — par priorité'));
  upcoming.forEach(a=>list.append(agendaRow(a,today)));

  list.append(el('div',{class:'ech-line'},
    el('span',{class:'ech-line-label'},
      'Échéance · aujourd\'hui · '+today.toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'}))
  ));

  if(overdue.length) list.append(el('div',{class:'agenda-head'}, 'Dépassées'));
  overdue.forEach(a=>list.append(agendaRow(a,today)));

  wrap.append(list);
}

function agendaRow(a,today){
  const d=new Date(a.echeance+'T00:00:00'); d.setHours(0,0,0,0);
  const days=Math.round((d-today)/86400000);
  const over=days<0;
  let rel, cls;
  if(over){ cls='ech-late'; rel='J+'+(-days); }
  else if(days===0){ cls='ech-late'; rel="auj."; }
  else if(days<=3){ cls='ech-soon'; rel='J-'+days; }
  else if(days<=7){ cls='ech-warn'; rel='J-'+days; }
  else { cls='ech-ok'; rel='J-'+days; }
  const c=a.client||{};
  return el('div',{class:'ag-row'+(over?' overdue':'')},
    el('div',{class:'ag-date '+cls},
      el('span',{class:'ag-day'}, d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})),
      el('span',{class:'ag-rel'}, rel)
    ),
    el('span',{class:'ag-dot',style:`background:${ETAT_COLOR[a.etat]}`}),
    el('div',{class:'ag-body'},
      el('div',{class:'ag-nom'}, a.nom),
      el('div',{class:'ag-meta'}, [a.etat, c.entreprise].filter(Boolean).join(' · '))
    ),
    el('div',{class:'ag-actions'},
      el('button',{class:'ag-btn',title:'Marquer comme répondu',onclick:()=>{
        a.repondu=true; persist(); renderAgenda(); if(currentView==='map') renderOverview();
      }},'✓ Répondu'),
      el('button',{class:'ag-btn ghost',onclick:()=>gotoLane(a)},'Suivi'),
      el('button',{class:'ag-btn ghost',onclick:()=>openModal(a)},'Modifier')
    )
  );
}

function upsertClientFromAffaire(cl){
  if(!cl) return;
  const societe=(cl.entreprise||'').trim(), nom=(cl.contact||'').trim(), tel=(cl.tel||'').trim(), mail=(cl.mail||'').trim();
  if(!societe && !nom && !tel && !mail) return;
  const n=s=>(s||'').toLowerCase().trim();
  let ex = contacts.clients.find(c => (mail && n(c.mail)===n(mail)) || (!mail && n(c.societe)===n(societe) && n(c.nom)===n(nom)));
  if(ex){ ex.societe=societe||ex.societe; ex.nom=nom||ex.nom; ex.tel=tel||ex.tel; ex.mail=mail||ex.mail; }
  else contacts.clients.push({id:uid(), nom, societe, secteur:'', tel, mail});
  saveContacts();
}

/* ---------- Sauvegarde locale automatique (File System Access API) ---------- */
let backupDir=null, needReauth=false;
const FS_OK = typeof window!=='undefined' && 'showDirectoryPicker' in window;

function idbReq(mode, fn){
  return new Promise((res,rej)=>{
    const r=indexedDB.open('momotion',1);
    r.onupgradeneeded=()=>{ if(!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
    r.onsuccess=()=>{ const db=r.result; const tx=db.transaction('kv',mode); const st=tx.objectStore('kv'); const q=fn(st);
      tx.oncomplete=()=>{ db.close(); res(q&&q.result); }; tx.onerror=()=>{ db.close(); rej(tx.error); }; };
    r.onerror=()=>rej(r.error);
  });
}
const idbSet=(k,v)=>idbReq('readwrite',st=>st.put(v,k));
const idbGet=(k)=>idbReq('readonly',st=>st.get(k));

function backupPayload(){
  return JSON.stringify({app:'MOMOtion Flow', version:1, exportedAt:new Date().toISOString(), affaires, tools, contacts}, null, 2);
}
async function dirPerm(request){
  if(!backupDir) return false;
  const opts={mode:'readwrite'};
  let p=await backupDir.queryPermission(opts);
  if(p==='granted') return true;
  if(request){ p=await backupDir.requestPermission(opts); return p==='granted'; }
  return false;
}
async function doBackup(manual){
  if(!backupDir){ if(manual) toast('Choisis d’abord un dossier'); return; }
  const ok=await dirPerm(!!manual);
  if(!ok){ needReauth=true; updateBackupUI(); if(manual) toast('Autorisation refusée'); return; }
  needReauth=false;
  try{
    const name=`momotion-${new Date().toISOString().slice(0,10)}.json`;
    const fh=await backupDir.getFileHandle(name,{create:true});
    const w=await fh.createWritable(); await w.write(new Blob([backupPayload()],{type:'application/json'})); await w.close();
    localStorage.setItem('momotion_last_backup', new Date().toISOString());
    dirty=false; updateBackupUI(); if(manual) toast('Sauvegarde effectuée');
  }catch(e){ if(manual) toast('Échec de la sauvegarde'); }
}
async function chooseBackupDir(){
  try{
    backupDir=await window.showDirectoryPicker({mode:'readwrite'});
    try{ await idbSet('backupDir', backupDir); }catch(e){}
    needReauth=false; updateBackupUI(); doBackup(true);
  }catch(e){/* annulé */}
}
async function restoreBackup(){
  try{
    const [fh]=await window.showOpenFilePicker({types:[{description:'Sauvegarde JSON',accept:{'application/json':['.json']}}]});
    const data=JSON.parse(await (await fh.getFile()).text());
    if(!confirm('Restaurer cette sauvegarde ? Les données actuelles seront remplacées.')) return;
    if(Array.isArray(data.affaires)){ affaires=data.affaires; persist(); }
    if(data.tools){ tools=data.tools; saveTools(); }
    if(data.contacts){ const c=data.contacts; c.clients=c.clients||[]; c.sous_traitants=c.sous_traitants||[]; contacts=c; saveContacts(); }
    toast('Sauvegarde restaurée'); setTimeout(()=>location.reload(),400);
  }catch(e){/* annulé */}
}
function lastBackupInfo(){ return localStorage.getItem('momotion_last_backup'); }
function checkHourlyBackup(){                 // sauvegarde auto toutes les heures dans le dossier défini
  if(!backupDir) return;
  const last=lastBackupInfo();
  if(!last || (Date.now()-new Date(last).getTime())>=3600000) doBackup(false);
}
function updateBackupUI(){
  const st=document.getElementById('bk-status'); if(!st) return;
  st.innerHTML='';
  if(!backupDir){ st.textContent='Aucun dossier défini.'; return; }
  const last=lastBackupInfo();
  const lastTxt = last ? new Date(last).toLocaleString('fr-FR',{dateStyle:'short',timeStyle:'short'}) : 'jamais';
  st.innerHTML = `Dossier : <b>${escapeHtml(backupDir.name||'sélectionné')}</b><br>Dernière sauvegarde : <b>${lastTxt}</b>`
    + (needReauth ? `<br><span class="bk-reauth">⚠ Ré-autorisation requise — clique « Sauvegarder maintenant ».</span>` : '');
}
function initBackup(){
  (async()=>{
    try{ const h=await idbGet('backupDir'); if(h) backupDir=h; }catch(e){}
    checkHourlyBackup();
  })();
  setInterval(checkHourlyBackup, 60000);   // vérifie chaque minute, sauvegarde si ≥ 1 h
  window.addEventListener('beforeunload', e=>{
    if(dirty){ e.preventDefault(); e.returnValue=''; }
  });
}

/* ---------- Calculatrice scientifique ---------- */
let calcExpr='', calcDeg=true;
function calcFormat(r){ return (Math.round(r*1e10)/1e10).toString(); }
function calcEval(disp){
  let s=disp.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/√/g,'sqrt').replace(/\^/g,'**')
           .replace(/π/g,'PI').replace(/(?<![a-zA-Z])e(?![a-zA-Z])/g,'E')
           .replace(/(\d+(?:\.\d+)?)!/g,'fact($1)')
           .replace(/(\d+(?:\.\d+)?)%/g,'($1/100)');
  const d = calcDeg ? Math.PI/180 : 1;
  const scope = {
    sin:x=>Math.sin(x*d), cos:x=>Math.cos(x*d), tan:x=>Math.tan(x*d),
    ln:Math.log, log:Math.log10, sqrt:Math.sqrt,
    fact:n=>{ n=Math.round(n); if(n<0||n>170) return NaN; let r=1; for(let i=2;i<=n;i++) r*=i; return r; },
    PI:Math.PI, E:Math.E
  };
  const names=Object.keys(scope);
  return new Function(...names, 'return ('+s+')')(...names.map(k=>scope[k]));
}
function calcRender(){
  const e=document.getElementById('calc-expr'); if(!e) return;
  e.textContent=calcExpr;
  try{ const r=calcEval(calcExpr||'0'); if(isFinite(r)) document.getElementById('calc-res').textContent=calcFormat(r); }catch(_){}
}
const CALC_BTNS=[
  {l:'sin',ins:'sin(',c:'fn'},{l:'cos',ins:'cos(',c:'fn'},{l:'tan',ins:'tan(',c:'fn'},{l:'DEG',act:'deg',c:'fn',id:'calc-degrad'},{l:'C',act:'clear',c:'util'},
  {l:'ln',ins:'ln(',c:'fn'},{l:'log',ins:'log(',c:'fn'},{l:'√',ins:'√(',c:'fn'},{l:'^',ins:'^',c:'op'},{l:'⌫',act:'back',c:'util'},
  {l:'(',ins:'('},{l:')',ins:')'},{l:'π',ins:'π',c:'op'},{l:'e',ins:'e',c:'op'},{l:'÷',ins:'÷',c:'op'},
  {l:'7',ins:'7'},{l:'8',ins:'8'},{l:'9',ins:'9'},{l:'x²',ins:'^2',c:'op'},{l:'×',ins:'×',c:'op'},
  {l:'4',ins:'4'},{l:'5',ins:'5'},{l:'6',ins:'6'},{l:'!',ins:'!',c:'op'},{l:'−',ins:'-',c:'op'},
  {l:'1',ins:'1'},{l:'2',ins:'2'},{l:'3',ins:'3'},{l:'%',ins:'%',c:'op'},{l:'+',ins:'+',c:'op'},
  {l:'0',ins:'0'},{l:'.',ins:'.'},{l:'±',act:'sign'},{l:'=',act:'equal',c:'eq span2'}
];
function calcClick(b){
  if(b.act==='clear') calcExpr='';
  else if(b.act==='back') calcExpr=calcExpr.slice(0,-1);
  else if(b.act==='deg'){ calcDeg=!calcDeg; document.getElementById('calc-degrad').textContent=calcDeg?'DEG':'RAD'; }
  else if(b.act==='sign') calcExpr=calcExpr.replace(/(-?\d*\.?\d+)$/, m=> m.charAt(0)==='-'?m.slice(1):'-'+m);
  else if(b.act==='equal'){ try{ const r=calcEval(calcExpr||'0'); if(!isFinite(r)) throw 0; calcExpr=calcFormat(r); }catch(_){ document.getElementById('calc-res').textContent='Erreur'; return; } }
  else if(b.ins!=null) calcExpr+=b.ins;
  calcRender();
}
function initCalc(){
  const grid=document.getElementById('calc-grid'); if(!grid) return;
  CALC_BTNS.forEach(b=>{ const btn=el('button',{class:'calc-btn '+(b.c||''),onclick:()=>calcClick(b)}, b.l); if(b.id) btn.id=b.id; grid.append(btn); });
  calcRender();
}

/* ---------- Démarrage ---------- */
function hideSplash(){
  const s=document.getElementById('splash');
  if(!s || s.classList.contains('hide')) return;
  s.classList.add('hide');
  setTimeout(()=>s.remove(),500);
}

renderAll();
updateAoChip();
function stickHeader(){
  const tb=document.querySelector('.topbar'), sh=document.getElementById('subhead');
  if(tb&&sh) sh.style.top=tb.offsetHeight+'px';
}
stickHeader();
window.addEventListener('resize', stickHeader);

initTools();
initCarnet();
initCalc();
initBackup();
initPWA();
setupClientAutocomplete();
setView('map');   // on arrive directement sur la carte

if(overviewMap) overviewMap.whenReady(()=>setTimeout(hideSplash,450));
else setTimeout(hideSplash,700);
setTimeout(hideSplash,2500);   // sécurité : le bandeau ne reste jamais bloqué
</script>
