<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MOMOtion Flow — Suivi d'affaires</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏗️</text></svg>">
<meta name="theme-color" content="#0E2A47">
<link rel="manifest" id="app-manifest">

<!-- Leaflet (OpenStreetMap) via CDN -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>

<!-- Polices -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* ============================================================
   SYSTÈME DE TOKENS — palette "chantier / plan de balisage"
   ============================================================ */
:root{
  --bg:#E9ECF0;
  --surface:#FFFFFF;
  --surface-2:#F5F7F9;
  --ink:#15202B;
  --muted:#5B6672;
  --line:#D6DBE1;
  --line-strong:#BFC6CF;

  --brand:#0E2A47;        /* navy technique : barre + actions primaires */
  --brand-700:#0A2038;
  --hivis:#F4C20D;        /* jaune haute visibilité : signature (ligne balisage) */
  --hivis-dark:#1C1C1C;

  /* couleurs des états */
  --etat-ao:#2563EB;      /* Appel d'offre */
  --etat-et:#D97706;      /* En étude */
  --etat-tx:#16A34A;      /* En travaux */
  --etat-tm:#EC4899;      /* Terminé (rose) */
  --etat-ss:#64748B;      /* Sans suite */

  --danger:#DC2626;
  --ok:#16A34A;

  --r:11px; --r-sm:8px; --r-xs:6px;
  --sh-1:0 1px 2px rgba(16,32,50,.08), 0 1px 1px rgba(16,32,50,.04);
  --sh-2:0 6px 20px rgba(16,32,50,.14);
  --sh-3:0 18px 50px rgba(16,32,50,.28);
}

*{box-sizing:border-box}
html,body{min-height:100%}
body{
  margin:0;
  font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  color:var(--ink);
  background:
    linear-gradient(var(--bg),var(--bg)),
    /* trame "papier millimétré" très discrète */
    repeating-linear-gradient(0deg, rgba(14,42,71,.035) 0 1px, transparent 1px 26px),
    repeating-linear-gradient(90deg, rgba(14,42,71,.035) 0 1px, transparent 1px 26px);
  font-size:14px;
  line-height:1.45;
}
h1,h2,h3{font-family:"Space Grotesk",sans-serif;margin:0}
button{font-family:inherit;cursor:pointer}
a{color:inherit}
.mono{font-family:"IBM Plex Mono",monospace}

/* ============================================================
   BARRE SUPÉRIEURE
   ============================================================ */
.topbar{
  position:sticky;top:0;z-index:40;
  background:var(--brand);
  color:#fff;
  border-bottom:3px solid var(--hivis);
  /* liseré "ruban de balisage" sous la barre */
  box-shadow:var(--sh-1);
}
.topbar-inner{
  max-width:1500px;margin:0 auto;padding:11px 18px;
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
}
.brand{display:flex;align-items:center;gap:11px;margin-right:4px}
.brand .glyph{
  width:30px;height:30px;border-radius:7px;flex:0 0 auto;
  background:var(--hivis);color:var(--hivis-dark);
  display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;font-size:16px;
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.12);
}
.brand h1{font-size:16px;font-weight:600;letter-spacing:.2px;line-height:1}
.brand small{display:block;font-family:"IBM Plex Mono";font-size:10.5px;color:#9fb4c9;letter-spacing:1.5px;text-transform:uppercase;margin-top:3px}

.spacer{flex:1 1 auto}

.search{
  display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.16);
  border-radius:var(--r-sm);padding:7px 11px;min-width:210px;
}
.search:focus-within{border-color:var(--hivis);background:rgba(255,255,255,.16)}
.search svg{opacity:.7}
.search input{
  border:0;background:transparent;color:#fff;outline:none;width:100%;font-size:13.5px;
}
.search input::placeholder{color:#9fb4c9}

.btn{
  border:1px solid transparent;border-radius:var(--r-sm);
  padding:8px 13px;font-weight:600;font-size:13px;
  display:inline-flex;align-items:center;gap:7px;white-space:nowrap;
  transition:transform .08s ease, background .15s ease, border-color .15s ease;
}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--hivis);color:var(--hivis-dark);border-color:rgba(0,0,0,.08)}
.btn-primary:hover{background:#ffce1f}
.btn-ghost{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.18)}
.btn-ghost:hover{background:rgba(255,255,255,.16)}
.icon-btn{
  background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.18);
  border-radius:var(--r-sm);width:36px;height:36px;display:grid;place-items:center;
}
.icon-btn:hover{background:rgba(255,255,255,.16)}
#btn-menu{font-size:19px}
.menu-wrap{position:relative}
.menu-dropdown{position:absolute;right:0;top:calc(100% + 8px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh-2);min-width:288px;z-index:50;padding:6px;display:flex;flex-direction:column;gap:2px}
.menu-dropdown.hidden{display:none}
.menu-item{display:flex;align-items:center;gap:11px;background:transparent;border:0;border-radius:var(--r-xs);padding:10px 12px;font-size:13px;font-weight:500;color:var(--ink);cursor:pointer;text-align:left;width:100%;font-family:inherit;white-space:nowrap}
.menu-item:hover{background:var(--surface-2)}
.menu-item[hidden]{display:none}
.menu-sep[hidden]{display:none}
.mi-ic{width:22px;height:22px;display:grid;place-items:center;color:var(--muted);flex:0 0 auto}
.menu-sep{height:1px;background:var(--line);margin:4px 2px}

/* ============================================================
   FILTRES D'ÉTAT
   ============================================================ */
.subhead{
  position:sticky;top:0;z-index:39;
  background:var(--surface);
  border-bottom:1px solid var(--line);
  box-shadow:var(--sh-1);
}
.filters{
  max-width:1500px;margin:0 auto;padding:11px 18px;
  display:flex;align-items:center;gap:9px;flex-wrap:wrap;
}
.filters .lbl{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin-right:2px}
.chip{
  border:1px solid var(--line-strong);background:var(--surface);
  border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--muted);
  display:inline-flex;align-items:center;gap:7px;transition:all .12s ease;
}
.chip .dot{width:9px;height:9px;border-radius:50%;background:currentColor}
.chip[data-etat="Appel d'offre"]{--c:var(--etat-ao)}
.chip[data-etat="En étude"]{--c:var(--etat-et)}
.chip[data-etat="En travaux"]{--c:var(--etat-tx)}
.chip[data-etat="Terminé"]{--c:var(--etat-tm)}
.chip[data-etat="Sans suite"]{--c:var(--etat-ss)}
.chip .dot{color:var(--c,var(--muted))}
.chip.on{color:#fff;background:var(--c,var(--brand));border-color:transparent}
.chip.on .dot{color:#fff;opacity:.9}
.chip.all.on{background:var(--brand);--c:var(--brand)}
.chip.ao-rep{--c:#38BDF8}
.chip.ao-val{--c:#0E7C86}
.ao-ind{font-size:12px}

.count{margin-left:auto;font-family:"IBM Plex Mono";font-size:12px;color:var(--muted)}

/* ============================================================
   PLATEAU / SWIMLANES
   ============================================================ */
.board{max-width:1500px;margin:0 auto;padding:14px 18px 60px;display:flex;flex-direction:column;gap:14px}

.lane{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh-1);display:flex;overflow:hidden;
}
/* --- panneau identité (collant à gauche pendant le scroll horizontal) --- */
.lane-head{
  flex:0 0 300px;width:300px;
  border-right:1px solid var(--line);
  padding:14px 15px;
  display:flex;flex-direction:column;gap:9px;
  background:linear-gradient(180deg,var(--surface),var(--surface-2));
  position:relative;
}
.lane-head::before{ /* bande d'état verticale */
  content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--etat-c,var(--muted));
}
.lane[data-etat="Appel d'offre"] .lane-head{--etat-c:var(--etat-ao)}
.lane[data-etat="En étude"] .lane-head{--etat-c:var(--etat-et)}
.lane[data-etat="En travaux"] .lane-head{--etat-c:var(--etat-tx)}
.lane[data-etat="Terminé"] .lane-head{--etat-c:var(--etat-tm)}
.lane[data-etat="Sans suite"] .lane-head{--etat-c:var(--etat-ss)}

.etat-badge{
  align-self:flex-start;font-family:"IBM Plex Mono";font-size:10.5px;font-weight:500;
  letter-spacing:.6px;text-transform:uppercase;color:#fff;background:var(--etat-c,var(--muted));
  padding:3px 9px;border-radius:999px;
}
.lane-nom{font-size:16px;font-weight:600;line-height:1.25;word-break:break-word}
.lane-meta{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--muted)}
.lane-meta .row{display:flex;gap:7px;align-items:flex-start}
.lane-meta .row svg{flex:0 0 auto;margin-top:2px;opacity:.75}
.lane-meta a{color:var(--brand);text-decoration:none;font-weight:500}
.lane-meta a:hover{text-decoration:underline}
.lane-meta .client-ent{color:var(--ink);font-weight:600}

.lane-actions{display:flex;gap:6px;margin-top:auto;padding-top:6px}
.mini-btn{
  border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-xs);
  padding:5px 9px;font-size:12px;font-weight:600;color:var(--muted);display:inline-flex;align-items:center;gap:5px;
}
.mini-btn:hover{color:var(--ink);border-color:var(--brand);background:var(--surface-2)}
.mini-btn.danger:hover{color:var(--danger);border-color:var(--danger)}

.map-mini{height:150px;width:100%;border-radius:var(--r-sm);margin-top:4px;border:1px solid var(--line);overflow:hidden}
.map-mini.hidden{display:none}

/* --- piste d'événements (scroll horizontal) --- */
.track{
  flex:1 1 auto;min-width:0;
  overflow-x:auto;overflow-y:hidden;
  padding:26px 18px;
  display:flex;align-items:center;gap:20px;
  position:relative;
  scrollbar-width:thin;scrollbar-color:var(--line-strong) transparent;
}
.track::-webkit-scrollbar{height:9px}
.track::-webkit-scrollbar-thumb{background:var(--line-strong);border-radius:9px}
/* SIGNATURE : ligne de balisage haute visibilité derrière les événements */
.track::before{
  content:"";position:absolute;left:16px;right:16px;top:50%;transform:translateY(-50%);height:6px;border-radius:3px;
  background:repeating-linear-gradient(90deg,var(--hivis) 0 15px,var(--hivis-dark) 15px 30px);
  opacity:.85;pointer-events:none;
}
.track.empty::before{display:none}

.event{
  flex:0 0 260px;width:260px;align-self:flex-start;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);
  box-shadow:var(--sh-1);display:flex;flex-direction:column;position:relative;
  animation:pop .18s ease;
}
@keyframes pop{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.event::before{ /* pastille sur la ligne de balisage */
  content:"";position:absolute;top:-9px;left:20px;width:14px;height:14px;border-radius:50%;
  background:var(--surface);border:3px solid var(--hivis-dark);box-shadow:0 0 0 2px var(--hivis);
}
.event-top{
  display:flex;align-items:center;gap:8px;
  padding:9px 10px;border-bottom:1px dashed var(--line);
  cursor:pointer;user-select:none;
}
.event.collapsed{flex:0 0 auto;width:auto;min-width:172px;max-width:250px}
.event.collapsed .event-top{border-bottom:0}
.event.collapsed .event-body{display:none}
.event-body{display:flex;flex-direction:column;flex:1;min-height:0}
.ev-toggle{background:transparent;border:0;color:var(--muted);font-size:11px;width:14px;flex:0 0 auto;cursor:pointer;line-height:1}
.ev-type-ic{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:12px;flex:0 0 auto;cursor:pointer}
.ev-type-ic.todo{background:#e9f2ff;color:#2563eb}
.ev-type-ic.doc{background:#fef3e2;color:#b45309}
.ev-summary{flex:1;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.event:not(.collapsed) .ev-summary{display:none}
.doc-text{width:100%;border:0;resize:vertical;min-height:130px;font-family:inherit;font-size:13px;line-height:1.5;color:var(--ink);padding:10px 11px;background:var(--surface);outline:none;border-radius:0 0 var(--r-sm) var(--r-sm)}
.doc-text::placeholder{color:var(--muted)}
.evt-menu{position:fixed;z-index:6000;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);box-shadow:var(--sh-2);padding:6px;display:flex;flex-direction:column;gap:4px;min-width:238px}
.evt-menu-item{display:flex;align-items:center;gap:11px;background:transparent;border:0;border-radius:var(--r-xs);padding:9px 10px;cursor:pointer;text-align:left;width:100%}
.evt-menu-item:hover{background:var(--surface-2)}
.emi-ic{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;font-size:15px;flex:0 0 auto}
.emi-ic.todo{background:#e9f2ff;color:#2563eb}
.emi-ic.doc{background:#fef3e2;color:#b45309}
.evt-menu-item b{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.emi-sub{font-size:11.5px;color:var(--muted)}
.ts{
  font-family:"IBM Plex Mono";font-size:11.5px;color:var(--brand);font-weight:500;
  cursor:pointer;border-radius:4px;padding:2px 4px;margin:-2px -4px;
}
.ts:hover{background:var(--surface-2);outline:1px dashed var(--line-strong)}
.ts-input{font-family:"IBM Plex Mono";font-size:11.5px;border:1px solid var(--line-strong);border-radius:5px;padding:2px 4px}
.ev-del{
  background:transparent;border:0;color:var(--muted);font-size:17px;line-height:1;
  width:22px;height:22px;border-radius:5px;display:grid;place-items:center;
}
.ev-del:hover{color:var(--danger);background:#fde8e8}

.notes{list-style:none;margin:0;padding:6px 8px;display:flex;flex-direction:column;gap:3px}
.note{
  display:flex;align-items:flex-start;gap:6px;padding:5px 6px;border-radius:var(--r-xs);
}
.note:hover{background:var(--surface-2)}
.note label{display:flex;align-items:flex-start;gap:8px;flex:1;cursor:pointer;min-width:0}
.note input[type=checkbox]{
  appearance:none;-webkit-appearance:none;flex:0 0 auto;margin-top:1px;
  width:17px;height:17px;border:2px solid var(--line-strong);border-radius:5px;background:var(--surface);
  display:grid;place-items:center;transition:all .12s ease;
}
.note input[type=checkbox]:hover{border-color:var(--ok)}
.note input[type=checkbox]:checked{background:var(--ok);border-color:var(--ok)}
.note input[type=checkbox]:checked::after{content:"";width:9px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.note-txt{font-size:13px;color:var(--ink);word-break:break-word;flex:1}
.note.done .note-txt{color:var(--muted);text-decoration:line-through}
.note-del{
  background:transparent;border:0;color:var(--line-strong);font-size:15px;line-height:1;
  width:20px;height:20px;border-radius:5px;flex:0 0 auto;opacity:0;transition:opacity .12s;
}
.note:hover .note-del{opacity:1}
.note-del:hover{color:var(--danger);background:#fde8e8}

.note-add{display:flex;gap:6px;padding:6px 9px 10px;margin-top:auto}
.note-add input{
  flex:1;border:1px solid var(--line);border-radius:var(--r-xs);padding:6px 8px;font-size:12.5px;background:var(--surface-2);
}
.note-add input:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.note-add button{
  border:1px solid var(--line);background:var(--surface);border-radius:var(--r-xs);
  width:30px;color:var(--brand);font-size:17px;font-weight:600;line-height:1;
}
.note-add button:hover{background:var(--brand);color:#fff;border-color:var(--brand)}

.add-event{
  flex:0 0 auto;align-self:flex-start;
  position:relative;z-index:1;                 /* passe AU-DESSUS de la ligne de balisage */
  background:var(--surface);                    /* masque la ligne derrière le bouton */
  border:2px dashed var(--line-strong);border-radius:var(--r-sm);
  padding:13px 16px;min-height:56px;
  display:flex;align-items:center;gap:10px;
  color:var(--muted);font-weight:600;font-size:13px;
  transition:border-color .15s ease,color .15s ease,background .15s ease;
}
.add-event::before{                             /* pastille-nœud posée sur la ligne, comme un événement */
  content:"";position:absolute;top:-9px;left:19px;width:14px;height:14px;border-radius:50%;
  background:var(--surface);border:3px solid var(--hivis-dark);box-shadow:0 0 0 2px var(--hivis);
}
.add-event:hover{border-color:var(--brand);color:var(--brand);background:var(--surface-2)}
.add-event .plus{
  width:24px;height:24px;border-radius:50%;background:var(--hivis);color:var(--hivis-dark);
  display:grid;place-items:center;font-size:16px;font-weight:700;line-height:1;flex:0 0 auto;
}

/* ============================================================
   ÉTAT VIDE
   ============================================================ */
.empty-state{
  text-align:center;padding:70px 20px;color:var(--muted);
  background:var(--surface);border:1px dashed var(--line-strong);border-radius:var(--r);
}
.empty-state .big{font-family:"Space Grotesk";font-size:20px;color:var(--ink);margin-bottom:8px}
.empty-state .btn-primary{margin-top:18px;background:var(--brand);color:#fff}
.empty-state .btn-primary:hover{background:var(--brand-700)}

/* ============================================================
   MODALE
   ============================================================ */
.backdrop{
  position:fixed;inset:0;background:rgba(10,25,42,.55);backdrop-filter:blur(3px);
  z-index:5000;display:grid;place-items:center;padding:20px;animation:fade .15s ease;
}
.backdrop.hidden{display:none}
@keyframes fade{from{opacity:0}to{opacity:1}}
.modal{
  background:var(--surface);border-radius:var(--r);box-shadow:var(--sh-3);
  width:min(760px,100%);max-height:92vh;overflow:auto;animation:rise .18s ease;
  position:relative;z-index:1;
}
@keyframes rise{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-head{
  padding:16px 20px;border-bottom:1px solid var(--line);
  display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--surface);z-index:2;
}
.modal-head h2{font-size:17px}
.modal-head .close{background:transparent;border:0;font-size:24px;color:var(--muted);width:32px;height:32px;border-radius:7px}
.modal-head .close:hover{background:var(--surface-2);color:var(--ink)}
.modal-body{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:15px}
.field{display:flex;flex-direction:column;gap:6px}
.field.full{grid-column:1 / -1}
.field label{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.field input,.field select{
  border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:9px 11px;font-size:14px;font-family:inherit;background:var(--surface);
}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(14,42,71,.12)}
.field .hint{font-size:11.5px;color:var(--muted)}
.field .err{font-size:12px;color:var(--danger);font-weight:600}

.addr-row{display:flex;gap:8px}
.addr-row input{flex:1}
.addr-row button{
  border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:var(--r-sm);
  padding:0 13px;font-weight:600;font-size:13px;white-space:nowrap;
}
.addr-row button:hover{background:var(--brand-700)}
.addr-row button:disabled{opacity:.55;cursor:progress}

#modal-map{height:230px;border-radius:var(--r-sm);border:1px solid var(--line-strong)}
.map-fallback{height:230px;border-radius:var(--r-sm);border:1px dashed var(--line-strong);display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:14px}
.coords{font-family:"IBM Plex Mono";font-size:11.5px;color:var(--muted)}

.modal-foot{
  padding:14px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;
  position:sticky;bottom:0;background:var(--surface);
}
.btn-lg{padding:10px 18px;font-size:14px;border-radius:var(--r-sm)}
.btn-cancel{background:var(--surface-2);border:1px solid var(--line-strong);color:var(--ink)}
.btn-cancel:hover{background:var(--line)}
.btn-save{background:var(--brand);color:#fff;border:1px solid var(--brand)}
.btn-save:hover{background:var(--brand-700)}

/* toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:var(--ink);color:#fff;padding:11px 18px;border-radius:var(--r-sm);font-size:13.5px;font-weight:500;
  box-shadow:var(--sh-2);z-index:80;opacity:0;transition:all .25s ease;pointer-events:none;
}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}

/* ============================================================
   BASCULE DE VUE + CARTE GLOBALE
   ============================================================ */
.viewtoggle{display:flex;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:var(--r-sm);padding:3px;gap:3px}
.viewtoggle .vt{background:transparent;border:0;color:#cdd9e6;font-weight:600;font-size:13px;padding:6px 14px;border-radius:6px}
.viewtoggle .vt:hover{color:#fff}
.viewtoggle .vt.on{background:var(--hivis);color:var(--hivis-dark)}

.mapview{max-width:1500px;margin:0 auto;padding:14px 18px 40px;position:relative}
.mapview.hidden{display:none}
.board.hidden{display:none}
#overview-map{height:calc(100vh - 210px);min-height:440px;border-radius:var(--r);border:1px solid var(--line);box-shadow:var(--sh-1);background:var(--surface-2);position:relative;z-index:0}
.map-tools{display:flex;flex-direction:column;gap:3px;background:var(--surface);border:1px solid rgba(0,0,0,.18);border-radius:8px;box-shadow:0 1px 5px rgba(0,0,0,.3);padding:3px}
.map-tools button{width:34px;height:34px;border:0;background:transparent;border-radius:6px;cursor:pointer;display:grid;place-items:center;color:var(--ink)}
.map-tools button:hover{background:var(--surface-2)}
.map-tools button.on{background:var(--brand);color:#fff}
.measure-label{background:rgba(255,255,255,.94);border:1px solid var(--line-strong);border-radius:5px;padding:1px 6px;font:600 12px/1.45 "IBM Plex Mono",monospace;color:var(--ink);white-space:nowrap;box-shadow:var(--sh-1)}
.measure-label::before{display:none}
#overview-map.hidden{display:none}
.map-note{position:absolute;top:26px;left:50%;transform:translateX(-50%);z-index:800;background:rgba(21,32,43,.92);color:#fff;padding:8px 15px;border-radius:999px;font-size:12.5px;font-weight:600;box-shadow:var(--sh-2);pointer-events:none;max-width:80%;text-align:center}
.map-note.hidden{display:none}

/* marqueur SVG (remplace l'icône PNG Leaflet qui buguait en file:// / CDN) */
.pin-div{background:transparent;border:0}
.pin-wrap{position:relative;width:28px;height:38px}
.pin-sym{position:absolute;top:5px;left:0;width:28px;text-align:center;font-size:15px;line-height:1;pointer-events:none}
.map-pop{font-family:"Inter",sans-serif;min-width:186px}
.map-pop .pe{font-family:"IBM Plex Mono";font-size:9.5px;letter-spacing:.5px;text-transform:uppercase;color:#fff;padding:2px 8px;border-radius:999px;display:inline-block;margin-bottom:7px}
.map-pop h3{font-family:"Space Grotesk";font-size:14.5px;margin:0 0 5px}
.map-pop .mp-meta{font-size:12px;color:var(--muted);margin-bottom:10px;line-height:1.45}
.map-pop .mp-actions{display:flex;gap:6px}
.map-pop button{border:1px solid var(--line-strong);background:var(--surface);border-radius:6px;padding:5px 10px;font-size:12px;font-weight:600;cursor:pointer;color:var(--brand)}
.map-pop button.primary{background:var(--brand);color:#fff;border-color:var(--brand)}
.leaflet-popup-content{margin:12px 14px}

/* surbrillance quand on ouvre une affaire depuis la carte */
.lane.flash{animation:flash 1.5s ease}
@keyframes flash{0%,100%{box-shadow:var(--sh-1)}25%,65%{box-shadow:0 0 0 3px var(--hivis),var(--sh-2)}}

/* ============================================================
   ÉCHÉANCE + STATUT « RÉPONDU »
   ============================================================ */
.deadline{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin:1px 0 1px}
.ech-chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;border:1px solid transparent}
.ech-chip svg{opacity:.85}
.ech-chip b{font-family:"IBM Plex Mono";font-weight:600;font-size:11px}
.ech-ok{background:#eef2f7;color:#334155;border-color:#dbe3ec}
.ech-warn{background:#fef3e2;color:#b45309;border-color:#f7dcae}
.ech-soon{background:#fdece9;color:#c2410c;border-color:#f6cabb}
.ech-late{background:#fde8e8;color:#b91c1c;border-color:#f3c2c2}
.ech-done{background:#e9f7ee;color:#15803d;border-color:#c3e9d1}
.repondu-toggle{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--muted);cursor:pointer;user-select:none}
.repondu-toggle.on{color:#15803d}
.repondu-toggle input{appearance:none;-webkit-appearance:none;width:16px;height:16px;border:2px solid var(--line-strong);border-radius:5px;display:grid;place-items:center;cursor:pointer}
.repondu-toggle input:checked{background:#16a34a;border-color:#16a34a}
.repondu-toggle input:checked::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}

.check-field{display:flex;align-items:center;gap:9px;font-size:14px;font-weight:500;color:var(--ink);padding:9px 0;cursor:pointer}
.check-field input{appearance:none;-webkit-appearance:none;flex:0 0 auto;width:20px;height:20px;border:2px solid var(--line-strong);border-radius:6px;display:grid;place-items:center;cursor:pointer}
.check-field input:checked{background:#16a34a;border-color:#16a34a}
.check-field input:checked::after{content:"";width:10px;height:5px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translateY(-1px)}
.check-row{display:flex;gap:10px;align-items:center}
.emoji-check{display:inline-grid;place-items:center;width:40px;height:40px;border:2px solid var(--line-strong);border-radius:9px;cursor:pointer;font-size:19px;background:var(--surface)}
.emoji-check input{display:none}
.emoji-check span{opacity:.45;line-height:1;filter:grayscale(.4)}
.emoji-check.on span{opacity:1;filter:none}
.emoji-check.av.on{border-color:#0E7C86;background:rgba(14,124,134,.10)}
.emoji-check.rep.on{border-color:#16a34a;background:rgba(22,163,74,.10)}
.check-field.av input:checked{background:#0E7C86;border-color:#0E7C86}
.mp-ech{font-weight:600;color:var(--ink);margin-top:3px}

/* ============================================================
   BANDEAU DE CHARGEMENT (splash)
   ============================================================ */
#splash{position:fixed;inset:0;z-index:9000;background:linear-gradient(160deg,var(--brand),#071a2e);display:grid;place-items:center;transition:opacity .45s ease}
#splash.hide{opacity:0;pointer-events:none}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:16px;color:#fff;text-align:center}
.splash-brand{display:flex;align-items:center;gap:13px}
.splash-brand .glyph{width:44px;height:44px;border-radius:11px;background:var(--hivis);color:var(--hivis-dark);display:grid;place-items:center;font-family:"Space Grotesk";font-weight:700;font-size:24px;box-shadow:inset 0 0 0 3px rgba(0,0,0,.12)}
.splash-brand h1{font-family:"Space Grotesk";font-size:26px;font-weight:600;letter-spacing:.3px}
.splash-sub{font-family:"IBM Plex Mono";font-size:12px;letter-spacing:2px;text-transform:uppercase;color:#9fb4c9}
.splash-bar{width:210px;height:6px;border-radius:3px;overflow:hidden;background:rgba(255,255,255,.12);position:relative}
.splash-bar::before{content:"";position:absolute;top:0;bottom:0;left:-42%;width:42%;border-radius:3px;background:repeating-linear-gradient(90deg,var(--hivis) 0 12px,var(--hivis-dark) 12px 24px);animation:load 1.1s ease-in-out infinite}
@keyframes load{0%{left:-42%}100%{left:100%}}

.mp-weather{margin-top:10px;padding-top:9px;border-top:1px dashed var(--line);display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--ink);min-height:22px}
.mp-weather .wx-emoji{font-size:18px;line-height:1}
.mp-weather .wx-temp{font-weight:700;font-family:"IBM Plex Mono"}
.mp-weather .wx-desc{color:var(--muted);line-height:1.3}
.mp-weather.muted{color:var(--muted);font-style:italic}

/* ============================================================
   VUE AGENDA — jalons datés triés autour de la ligne « échéance »
   ============================================================ */
.agenda{max-width:920px;margin:0 auto;padding:18px 18px 60px}
.agenda.hidden{display:none}
.agenda-empty{text-align:center;color:var(--muted);padding:60px 22px;border:1px dashed var(--line-strong);border-radius:var(--r);background:var(--surface);font-size:14px}
.agenda-head{font-family:"IBM Plex Mono";font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:6px 2px 10px}
.agenda-list{display:flex;flex-direction:column;gap:10px}

.ag-row{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;box-shadow:var(--sh-1)}
.ag-row.overdue{border-color:#f0c4c4;background:#fffafa}
.ag-date{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;min-width:66px;padding:6px 8px;border-radius:var(--r-xs);border:1px solid transparent}
.ag-date .ag-day{font-family:"Space Grotesk";font-weight:600;font-size:13px;line-height:1.1}
.ag-date .ag-rel{font-family:"IBM Plex Mono";font-size:10.5px;font-weight:600;margin-top:2px}
.ag-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto}
.ag-body{flex:1;min-width:0}
.ag-nom{font-family:"Space Grotesk";font-weight:600;font-size:15px;line-height:1.2;word-break:break-word}
.ag-meta{font-size:12px;color:var(--muted);margin-top:2px}
.ag-actions{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.ag-btn{border:1px solid var(--brand);background:var(--brand);color:#fff;border-radius:var(--r-xs);padding:6px 10px;font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap}
.ag-btn:hover{background:var(--brand-700)}
.ag-btn.ghost{background:var(--surface);color:var(--brand);border-color:var(--line-strong)}
.ag-btn.ghost:hover{background:var(--surface-2)}

/* la ligne « échéance » (aujourd'hui) : ruban de balisage hi-vis */
.ech-line{position:relative;display:flex;align-items:center;justify-content:center;margin:10px 0;height:34px}
.ech-line::before{content:"";position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);height:6px;border-radius:3px;background:repeating-linear-gradient(90deg,var(--hivis) 0 15px,var(--hivis-dark) 15px 30px)}
.ech-line-label{position:relative;z-index:1;background:var(--brand);color:#fff;font-family:"IBM Plex Mono";font-size:11px;font-weight:600;letter-spacing:.5px;text-transform:uppercase;padding:6px 15px;border-radius:999px;box-shadow:var(--sh-1)}

/* ============================================================
   CHRONO : nœuds d'événement + gros nœud d'ajout
   ============================================================ */
.event-node{
  width:38px;height:38px;border-radius:50%;flex:0 0 auto;position:relative;z-index:1;
  background:var(--surface);border:3px solid var(--hivis-dark);box-shadow:0 0 0 2px var(--hivis), var(--sh-1);
  display:grid;place-items:center;font-size:17px;line-height:1;cursor:pointer;transition:transform .1s ease;
}
.event-node:hover{transform:scale(1.12)}
.add-node{
  width:46px;height:46px;border-radius:50%;flex:0 0 auto;position:relative;z-index:1;
  background:var(--hivis);color:var(--hivis-dark);border:3px solid var(--hivis-dark);
  display:grid;place-items:center;font-size:26px;font-weight:700;line-height:1;cursor:pointer;transition:transform .1s ease;
}
.add-node:hover{transform:scale(1.08);background:#ffce1f}

/* ============================================================
   GRANDE MODALE D'ÉVÉNEMENT
   ============================================================ */
.ev-modal{width:min(680px,100%)}
.ev-head-main{display:flex;align-items:center;gap:11px;flex:1;min-width:0}
.ev-type-badge{font-family:"IBM Plex Mono";font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;white-space:nowrap;flex:0 0 auto}
.ev-type-badge.todo{background:#e9f2ff;color:#2563eb}
.ev-type-badge.doc{background:#fef3e2;color:#b45309}
.ev-title-input{flex:1;min-width:0;border:0;background:transparent;font-family:"Space Grotesk";font-size:18px;font-weight:600;color:var(--ink);outline:none}
.ev-title-input::placeholder{color:var(--line-strong);font-weight:500}
.ev-del-btn{background:transparent;border:0;font-size:15px;color:var(--muted);width:34px;height:34px;border-radius:7px;cursor:pointer;flex:0 0 auto}
.ev-del-btn:hover{background:#fde8e8;color:var(--danger)}
.ev-tool-btn{background:transparent;border:0;font-size:15px;color:var(--muted);width:34px;height:34px;border-radius:7px;cursor:pointer;flex:0 0 auto}
.ev-tool-btn:hover{background:var(--surface-2);color:var(--ink)}
.ev-date-row{padding:0 20px 12px;border-bottom:1px solid var(--line)}
.ev-date-row span{font-size:12px;color:var(--muted)}
.ev-body{padding:16px 20px 22px}
.ev-body .notes{padding:0;gap:4px}
.ev-body .note{padding:8px}
.ev-body .note-txt{font-size:14px}
.ev-body .note-add{padding:12px 0 0;margin-top:6px}
.ev-body .note-input{flex:1;border:1px solid var(--line-strong);border-radius:var(--r-xs);padding:9px 11px;font-size:13.5px;background:var(--surface-2)}
.ev-body .note-input:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.doc-text.big{min-height:340px;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:12px 14px}

/* ============================================================
   TIROIR OUTILS (gauche) : bloc-notes + liens utiles
   ============================================================ */
.tools-handle{
  position:fixed;left:0;top:50%;transform:translateY(-50%);z-index:43;
  background:var(--brand);color:#fff;border:0;cursor:pointer;padding:16px 9px;
  border-radius:0 11px 11px 0;box-shadow:var(--sh-2);
  writing-mode:vertical-rl;text-orientation:mixed;
  font-family:"Space Grotesk";font-weight:600;font-size:13px;letter-spacing:1.5px;
}
.tools-handle:hover{background:var(--brand-700)}
.tools-handle{transition:left .25s ease}
.tools-handle.open{left:min(340px,88vw)}
.tools-drawer{
  position:fixed;left:0;top:0;bottom:0;width:340px;max-width:88vw;
  background:var(--surface);border-right:1px solid var(--line);box-shadow:var(--sh-2);
  z-index:4000;transform:translateX(-100%);transition:transform .25s ease;
  display:flex;flex-direction:column;
}
.tools-drawer.open{transform:none}
.tools-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;background:var(--brand);color:#fff}
.tools-head h2{font-size:16px}
.tools-head .close{background:transparent;border:0;color:#fff;font-size:23px;cursor:pointer;width:32px;height:32px;border-radius:7px;line-height:1}
.tools-head .close:hover{background:rgba(255,255,255,.16)}
.tools-tabs{display:flex;gap:6px;padding:11px 12px;border-bottom:1px solid var(--line)}
.tools-tab{flex:1;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.tools-tab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.tools-body{flex:1;overflow:auto;padding:14px}
.tools-pane{display:none}
.tools-pane.on{display:block}
.notes-area{width:100%;min-height:calc(100vh - 210px);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:12px;font-family:inherit;font-size:14px;line-height:1.55;resize:vertical;outline:none;background:var(--surface-2)}
.notes-area:focus{background:var(--surface);border-color:var(--brand)}
.links-list{display:flex;flex-direction:column;gap:8px}
.link-btn{display:flex;align-items:center;gap:8px;border:0;border-radius:var(--r-sm);padding:11px 12px;color:#fff;font-weight:600;font-size:13.5px;cursor:pointer;text-align:left;box-shadow:var(--sh-1)}
.link-btn .lk-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 1px rgba(0,0,0,.25)}

/* ============================================================
   MINI-ÉDITEUR ENRICHI (bloc-notes + documents)
   ============================================================ */
.rt{border:1px solid var(--line-strong);border-radius:var(--r-sm);background:var(--surface);display:flex;flex-direction:column;overflow:hidden}
.rt-bar{display:flex;gap:3px;padding:6px;border-bottom:1px solid var(--line);background:var(--surface-2)}
.rt-btn{width:30px;height:28px;border:1px solid transparent;background:transparent;border-radius:6px;cursor:pointer;font-size:14px;color:var(--ink);display:grid;place-items:center;line-height:1}
.rt-btn:hover{background:var(--surface);border-color:var(--line-strong)}
.rt-btn.b{font-weight:800}
.rt-btn.i{font-style:italic;font-family:Georgia,serif}
.rt-btn.u{text-decoration:underline}
.rt-print{margin-left:auto;width:auto;padding:0 10px;font-size:12.5px;font-weight:600;color:var(--brand);gap:5px}
.bk-btn{width:100%;background:var(--brand);color:#fff;border:1px solid var(--brand);border-radius:var(--r-sm);padding:10px;font-weight:600;font-size:13px;cursor:pointer}
.bk-btn:hover{background:var(--brand-700)}
.bk-status{font-size:12.5px;color:var(--muted);margin:12px 0;line-height:1.55}
.bk-status b{color:var(--ink)}
.bk-reauth{color:#b45309;font-weight:600}
.bk-actions{display:flex;gap:8px}
.bk-btn2{flex:1;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px;font-weight:600;font-size:12.5px;cursor:pointer;color:var(--brand)}
.bk-btn2:hover{background:var(--surface-2)}
.bk-info{font-size:11.5px;color:var(--muted);line-height:1.55;margin-top:14px}
.bk-note{font-size:12.5px;color:var(--muted);line-height:1.55;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px}
.bk-info code,.bk-note code{background:var(--surface-2);padding:1px 4px;border-radius:4px;font-size:11px}
.rt-edit{padding:11px 12px;min-height:120px;outline:none;font-size:14px;line-height:1.55;white-space:pre-wrap;overflow:auto;word-break:break-word}
.rt-edit:empty::before{content:attr(data-ph);color:var(--muted);pointer-events:none}
.rt-edit ul{margin:6px 0;padding-left:22px}
.rt-edit.rt-notes{min-height:calc(100vh - 262px)}
.rt-edit.rt-doc{min-height:320px}
.calc{display:flex;flex-direction:column;gap:10px}
.pane-toolbar{display:flex;justify-content:flex-end;margin-bottom:8px}
.pane-print{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xs);padding:6px 11px;font-size:12.5px;font-weight:600;color:var(--brand);cursor:pointer}
.pane-print:hover{background:var(--surface-2)}
.calc-screen{background:var(--surface-2);border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:10px 12px;min-height:62px;display:flex;flex-direction:column;justify-content:center;gap:2px;text-align:right}
.calc-expr{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);min-height:16px;word-break:break-all}
.calc-res{font-family:"IBM Plex Mono",monospace;font-size:22px;font-weight:600;color:var(--ink);word-break:break-all}
.calc-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.calc-btn{padding:12px 0;border:1px solid var(--line-strong);border-radius:var(--r-xs);background:var(--surface);font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;font-family:inherit}
.calc-btn:hover{background:var(--surface-2)}
.calc-btn.fn{color:var(--brand);font-size:12.5px}
.calc-btn.op{color:var(--brand)}
.calc-btn.util{color:var(--danger)}
.calc-btn.eq{background:var(--brand);color:#fff;border-color:var(--brand)}
.calc-btn.eq:hover{background:var(--brand-700)}
.calc-btn.span2{grid-column:span 2}

/* ============================================================
   CARNET D'ADRESSES (tiroir droit) + autocomplétion
   ============================================================ */
.carnet-handle{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:43;background:var(--brand);color:#fff;border:0;cursor:pointer;padding:16px 9px;border-radius:11px 0 0 11px;box-shadow:var(--sh-2);writing-mode:vertical-rl;text-orientation:mixed;font-family:"Space Grotesk";font-weight:600;font-size:13px;letter-spacing:1.5px;transition:right .25s ease}
.carnet-handle:hover{background:var(--brand-700)}
.carnet-handle.open{right:min(360px,90vw)}
.carnet-drawer{position:fixed;right:0;top:0;bottom:0;width:360px;max-width:90vw;background:var(--surface);border-left:1px solid var(--line);box-shadow:var(--sh-2);z-index:4000;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column}
.carnet-drawer.open{transform:none}
.ctab{flex:1;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:8px;font-weight:600;font-size:13px;color:var(--muted);cursor:pointer}
.ctab.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.carnet-pane{display:none}
.carnet-pane.on{display:block}
.carnet-search{padding:10px 12px 0}
.carnet-search input{width:100%;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 11px;font-size:13px;background:var(--surface-2);font-family:inherit}
.carnet-search input:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.add-contact{width:100%;background:transparent;border:1px dashed var(--line-strong);color:var(--muted);border-radius:var(--r-sm);padding:9px;font-weight:600;font-size:13px;cursor:pointer;margin-bottom:10px}
.add-contact:hover{border-color:var(--brand);color:var(--brand)}
.contact-list{display:flex;flex-direction:column;gap:9px}
.contact-card{border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 12px 11px;background:var(--surface);box-shadow:var(--sh-1);position:relative}
.contact-card h3{font-family:"Space Grotesk";font-size:14.5px;margin:0 0 2px;padding-right:56px}
.contact-card .soc{font-size:12.5px;color:var(--ink);font-weight:600}
.contact-card .sect{font-size:11.5px;color:var(--muted);margin-top:1px}
.contact-card .cc-row{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted);margin-top:4px}
.contact-card a{color:var(--brand);text-decoration:none;font-weight:500}
.contact-card a:hover{text-decoration:underline}
.cc-actions{position:absolute;top:8px;right:8px;display:flex;gap:3px}
.cc-actions button{background:transparent;border:0;cursor:pointer;width:26px;height:26px;border-radius:6px;color:var(--muted);font-size:13px}
.cc-actions button:hover{background:var(--surface-2);color:var(--ink)}
.cc-actions .del:hover{background:#fde8e8;color:var(--danger)}
.contact-form{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px;background:var(--surface-2);margin-bottom:12px;display:flex;flex-direction:column;gap:8px}
.contact-form[hidden]{display:none}
.contact-form input{border:1px solid var(--line-strong);border-radius:var(--r-xs);padding:8px 10px;font-size:13px;background:var(--surface);font-family:inherit}
.contact-form input:focus{outline:none;border-color:var(--brand)}
.cf-actions{display:flex;gap:8px;justify-content:flex-end}
.cf-save{background:var(--brand);color:#fff;border:1px solid var(--brand);border-radius:var(--r-xs);padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer}
.cf-save:hover{background:var(--brand-700)}
.cf-cancel{background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--r-xs);padding:7px 13px;font-weight:600;font-size:13px;cursor:pointer;color:var(--muted)}

.ac-wrap{position:relative}
.ac-wrap>input{width:100%}
.ac-list{position:absolute;left:0;right:0;top:100%;z-index:10;background:var(--surface);border:1px solid var(--brand);border-top:0;border-radius:0 0 var(--r-sm) var(--r-sm);box-shadow:var(--sh-2);max-height:210px;overflow:auto}
.ac-list.hidden{display:none}
.ac-item{padding:8px 11px;cursor:pointer}
.ac-item:hover{background:var(--surface-2)}
.ac-item .ac-soc{font-weight:600;font-size:13px}
.ac-item .ac-sub{color:var(--muted);font-size:11.5px}

@media (max-width:720px){
  .modal-body{grid-template-columns:1fr}
  .lane{flex-direction:column}
  .lane-head{flex-basis:auto;width:100%;border-right:0;border-bottom:1px solid var(--line)}
}
@media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important}}

<script>
/* ============================================================================
   MOMOtion Flow — Suivi d'affaires
   V1 : stockage local (localStorage + repli mémoire). Structuré pour Firebase.
   ----------------------------------------------------------------------------
   ► PASSAGE À FIREBASE (phase 2)
     Toute la persistance passe par l'objet `Store`. Il suffit de remplacer
     ses 4 méthodes (load/saveAll/upsert/remove) par des appels Firestore,
     par ex. une collection "affaires" avec un document par affaire (id).
     Le reste du code (rendu, événements, notes) n'a pas à changer.
   ============================================================================ */

const ETATS = ["Appel d'offre","En étude","En travaux","Terminé","Sans suite"];
const ETAT_COLOR = {"Appel d'offre":"#2563EB","En étude":"#D97706","En travaux":"#16A34A","Terminé":"#EC4899","Sans suite":"#64748B"};
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* Marqueur cartographique en SVG intégré — évite le bug des PNG Leaflet par défaut.
   symbol : optionnel, emoji affiché au centre à la place du point blanc (ex. 🕑 pour "répondu"). */
function pinIcon(color, symbol){
  const c = color || '#0E2A47';
  const center = symbol ? `<span class="pin-sym">${symbol}</span>` : '';
  const dot = symbol ? '' : `<circle cx="14" cy="13" r="4.6" fill="#ffffff"/>`;
  return L.divIcon({
    className:'pin-div', iconSize:[28,38], iconAnchor:[14,37], popupAnchor:[0,-34],
    html:`<div class="pin-wrap"><svg width="28" height="38" viewBox="0 0 28 38" xmlns="http://www.w3.org/2000/svg"><path d="M14 37S26 22 26 13A12 12 0 0 0 2 13C2 22 14 37 14 37Z" fill="${c}" stroke="#ffffff" stroke-width="2"/>${dot}</svg>${center}</div>`
  });
}
/* symbole affiché au centre du pin selon l'état de l'affaire */
function pinSymbol(a){
  if(a.avalider)            return '🔍';
  if(a.etat==='En travaux') return '🏗️';
  if(a.etat==='Terminé')    return '💵';
  if(a.etat==='Sans suite') return '♻️';
  if(a.etat==='En étude')   return '⚙️';
  if(a.repondu)             return '🕑';
  if(a.etat==="Appel d'offre") return '📥';
  return null;
}
/* couleur du pin : bleu ciel pour un appel d'offre répondu, sinon couleur de l'état */
function pinColor(etat, repondu, avalider){
  if(avalider) return '#F4C20D';                          // jaune "à valider"
  if(etat==="Appel d'offre" && repondu) return '#38BDF8'; // bleu ciel
  return ETAT_COLOR[etat];
}

/* ---------- Couche de stockage (à remplacer par Firebase en phase 2) ---------- */
const Store = {
  KEY:'suivi_affaires_v1',
  _ls:null,      // localStorage disponible ? (mis en cache)
  _mem:[],       // repli mémoire (aperçu Claude, mode privé, etc.)
  _check(){
    if(this._ls!==null) return this._ls;
    try{ const k='__t__'; localStorage.setItem(k,'1'); localStorage.removeItem(k); this._ls=true; }
    catch(e){ this._ls=false; }
    return this._ls;
  },
  load(){
    if(this._check()){
      try{ return JSON.parse(localStorage.getItem(this.KEY)) || []; }catch(e){ return []; }
    }
    return this._mem;
  },
  saveAll(data){
    this._mem = data;
    if(this._check()){
      try{ localStorage.setItem(this.KEY, JSON.stringify(data)); }catch(e){}
    }
  }
  /* Firebase — exemple de remplacement :
     async load(){ const s=await getDocs(collection(db,'affaires')); return s.docs.map(d=>d.data()); }
     async upsert(a){ await setDoc(doc(db,'affaires',a.id), a); }
     async remove(id){ await deleteDoc(doc(db,'affaires',id)); }
  */
};

/* ---------- État applicatif ---------- */
let affaires = Store.load();
let activeEtats = new Set(ETATS);
let aoMode = 0;   // 0 tous · 1 non répondu · 2 à valider · 3 répondu · 4 masqués
let searchTerm = '';
let dirty=false;                         // modifs non encore écrites dans le dossier de sauvegarde
const persist = () => { Store.saveAll(affaires); dirty=true; };

/* Outils : bloc-notes + liens utiles (stockage séparé de localStorage) */
const TOOLS_KEY='suivi_tools_v1';
let tools = (function(){
  if(Store._check()){ try{ return JSON.parse(localStorage.getItem(TOOLS_KEY)) || {notes:'',links:[]}; }catch(e){} }
  return {notes:'',links:[]};
})();
function saveTools(){ dirty=true; if(Store._check()){ try{ localStorage.setItem(TOOLS_KEY, JSON.stringify(tools)); }catch(e){} } }

/* Carnet d'adresses (stockage séparé) */
const CONTACTS_KEY='suivi_contacts_v1';
let contacts = (function(){
  let c; if(Store._check()){ try{ c=JSON.parse(localStorage.getItem(CONTACTS_KEY)); }catch(e){} }
  c = c || {clients:[],sous_traitants:[]};
  c.clients = c.clients||[]; c.sous_traitants = c.sous_traitants||[];
  return c;
})();
function saveContacts(){ dirty=true; if(Store._check()){ try{ localStorage.setItem(CONTACTS_KEY, JSON.stringify(contacts)); }catch(e){} } }
let contactSearch='';

/* Tracés & mesures sur la carte (stockage séparé) */
const DRAW_KEY='suivi_drawings_v1';
let drawings=(function(){ if(Store._check()){ try{ return JSON.parse(localStorage.getItem(DRAW_KEY))||[]; }catch(e){} } return []; })();
function saveDrawings(){ dirty=true; if(Store._check()){ try{ localStorage.setItem(DRAW_KEY, JSON.stringify(drawings)); }catch(e){} } }

/* ---------- Petit helper de création de noeuds (sûr : texte via textContent) ---------- */
function el(tag, props, ...kids){
  const n = document.createElement(tag);
  if(props) for(const [k,v] of Object.entries(props)){
    if(v===null||v===undefined||v===false) continue;
    if(k==='class') n.className=v;
    else if(k==='html') n.innerHTML=v;
    else if(k==='dataset') Object.assign(n.dataset,v);
    else if(k.startsWith('on') && typeof v==='function') n.addEventListener(k.slice(2).toLowerCase(),v);
    else n.setAttribute(k,v);
  }
  for(const kid of kids.flat()){
    if(kid===null||kid===undefined||kid===false) continue;
    n.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return n;
}
const svg = (paths,w=16) => `<svg width="${w}" height="${w}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${paths}</svg>`;
const ICON = {
  pin:'<path d="M12 21s-7-6.3-7-11a7 7 0 0 1 14 0c0 4.7-7 11-7 11Z"/><circle cx="12" cy="10" r="2.5"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/>',
  phone:'<path d="M4 5c0 9 6 15 15 15l1-4-5-2-2 2c-2-1-4-3-5-5l2-2-2-5Z"/>',
  mail:'<rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>',
  map:'<path d="m9 4 6 2 6-2v14l-6 2-6-2-6 2V6l6-2Z"/><path d="M9 4v14M15 6v14"/>',
  edit:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/>',
  trash:'<path d="M3 6h18M8 6V4h8v2M5 6l1 14h12l1-14"/>',
  clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7.5V12l3 2"/>'
};

/* ---------- Échéance de l'appel d'offre ---------- */
function echeanceInfo(a){
  const d = new Date(a.echeance+'T00:00:00');
  const today = new Date(); today.setHours(0,0,0,0);
  const days = Math.round((d - today)/86400000);
  const label = d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
  let rel=null, cls='ech-ok';
  if(a.repondu){ cls='ech-done'; }
  else if(days<0){ cls='ech-late'; rel=`J+${-days}`; }
  else if(days===0){ cls='ech-late'; rel="aujourd'hui"; }
  else if(days<=3){ cls='ech-soon'; rel=`J-${days}`; }
  else if(days<=7){ cls='ech-warn'; rel=`J-${days}`; }
  else { cls='ech-ok'; rel=`J-${days}`; }
  return {label, rel, cls};
}

function renderDeadline(a){
  if(!a.echeance && a.etat!=="Appel d'offre") return null;
  const wrap = el('div',{class:'deadline'});
  if(a.echeance){
    const info = echeanceInfo(a);
    wrap.append(el('span',{class:'ech-chip '+info.cls},
      el('span',{html:svg(ICON.clock,13)}),
      el('span',{}, a.repondu ? 'Répondu · '+info.label : info.label),
      info.rel ? el('b',{}, info.rel) : null
    ));
  }
  const cb = el('input',{type:'checkbox'}); cb.checked = !!a.repondu;
  cb.addEventListener('change',()=>{
    a.repondu = cb.checked; persist();
    wrap.replaceWith(renderDeadline(a) || el('span'));
    if(currentView==='map') renderOverview();
  });
  wrap.append(el('label',{class:'repondu-toggle'+(a.repondu?' on':'')}, cb, 'Répondu'));
  return wrap;
}

/* ---------- Formatage horodatage ---------- */
const fmtTs = iso => {
  const d = new Date(iso);
  if(isNaN(d)) return '—';
  return d.toLocaleString('fr-FR',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
};
const toLocalInput = iso => { // -> valeur pour <input type=datetime-local>
  const d = new Date(iso); const p=n=>String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
};

/* ============================================================================
   RENDU
   ============================================================================ */
const board = document.getElementById('board');

function matchesFilters(a){
  if(a.etat==="Appel d'offre"){
    if(aoMode===4) return false;                             // masqués
    if(aoMode===1 && (a.repondu||a.avalider)) return false;  // non répondu seulement
    if(aoMode===2 && !a.avalider) return false;              // à valider seulement
    if(aoMode===3 && !a.repondu) return false;               // répondu seulement
  }else if(!activeEtats.has(a.etat)){
    return false;
  }
  if(searchTerm){
    const hay = [a.nom, a.adresse?.text, a.client?.entreprise, a.client?.contact].join(' ').toLowerCase();
    if(!hay.includes(searchTerm)) return false;
  }
  return true;
}

/* Compteur : les affaires Terminé / Sans suite ne comptent pas */
const CLOSED_ETATS = new Set(["Terminé","Sans suite"]);
function updateCount(){
  const active = affaires.filter(a=>!CLOSED_ETATS.has(a.etat));
  const shown  = active.filter(matchesFilters);
  document.getElementById('count').textContent =
    `${shown.length} / ${active.length} affaire${active.length>1?'s':''}`;
}

function renderAll(){
  // mémoriser le scroll horizontal de chaque piste
  const scroll = {};
  board.querySelectorAll('.track').forEach(t=>scroll[t.dataset.id]=t.scrollLeft);

  board.innerHTML='';
  const list = affaires.filter(matchesFilters);
  updateCount();

  if(affaires.length===0){
    board.append(el('div',{class:'empty-state'},
      el('div',{class:'big'},"Aucune affaire pour l'instant"),
      el('div',{},"Créez votre première affaire pour lancer le suivi."),
      el('button',{class:'btn btn-primary',onclick:()=>openModal()},'+ Nouvelle affaire')
    ));
    return;
  }
  if(list.length===0){
    board.append(el('div',{class:'empty-state'},
      el('div',{class:'big'},"Aucun résultat"),
      el('div',{},"Aucune affaire ne correspond au filtre ou à la recherche.")
    ));
    return;
  }
  for(const a of list){
    const lane = renderLane(a);
    board.append(lane);
    const track = lane.querySelector('.track');
    if(scroll[a.id]!=null) track.scrollLeft = scroll[a.id];
  }
}

function renderLane(a){
  const c = a.client||{};
  const head = el('div',{class:'lane-head'},
    el('span',{class:'etat-badge'}, a.etat),
    el('h2',{class:'lane-nom'}, a.nom),

      c.entreprise && el('div',{class:'row'}, el('span',{html:svg(ICON.user,14)}),
        el('span',{}, el('span',{class:'client-ent'}, c.entreprise), c.contact?` · ${c.contact}`:'')),
      c.tel && el('div',{class:'row'}, el('span',{html:svg(ICON.phone,14)}), el('a',{href:`tel:${c.tel.replace(/\s/g,'')}`}, c.tel)),

function allDone(ev){ const n=ev.notes||[]; return n.length>0 && n.every(x=>x.done); }
function eventIcon(ev){
  if(ev.type==='doc') return '📋';
  return allDone(ev) ? '✅' : '☑️';
}
function eventTitle(ev){
  if(ev.title && ev.title.trim()) return ev.title.trim();
  return ev.type==='doc' ? 'Document' : 'To-Do';
}
function nodeTooltip(ev){ return fmtTs(ev.ts)+' — '+eventTitle(ev); }

function renderEventNode(a, ev){
  const node = el('button',{class:'event-node '+(ev.type==='doc'?'doc':'todo'), dataset:{id:ev.id}, title:nodeTooltip(ev)}, eventIcon(ev));
  node.addEventListener('click',()=>openEventModal(a,ev));
  return node;
}
function refreshEventNode(ev){
  const n=document.querySelector(`.event-node[data-id="${ev.id}"]`);
  if(n){ n.textContent=eventIcon(ev); n.title=nodeTooltip(ev); }
}

/* ---------- Grande modale d'un événement (To-Do ou Document) ---------- */
let evEditing=null, _pt;
function persistDebounced(){ clearTimeout(_pt); _pt=setTimeout(persist,400); }

function openEventModal(a, ev){
  evEditing={a,ev};
  const isDoc = ev.type==='doc';
  const badge = document.getElementById('ev-type-badge');
  badge.className='ev-type-badge '+(isDoc?'doc':'todo');
  badge.textContent = isDoc ? '📋 Document' : (allDone(ev)?'✅ To-Do':'☑️ To-Do');

  const ti = document.getElementById('ev-title');
  ti.value = ev.title||'';
  ti.oninput = ()=>{ ev.title=ti.value; persistDebounced(); refreshEventNode(ev); };

  document.getElementById('ev-date').textContent = fmtTs(ev.ts);

  const body = document.getElementById('ev-body'); body.innerHTML=''; body.onchange=null;
  if(isDoc){
    const red = makeRichEditor(ev.text||'', html=>{ ev.text=html; persistDebounced(); });
    red.editor.classList.add('rt-doc');
    red.editor.setAttribute('data-ph','Collez ou saisissez vos informations…');
    body.append(red.wrap);
  }else{
    const notes = el('ul',{class:'notes'});
    (ev.notes||[]).forEach(nt=>notes.append(renderNote(a,ev,nt)));
    const input = el('input',{class:'note-input',type:'text',placeholder:'Ajouter une tâche…',
      onkeydown:e=>{ if(e.key==='Enter'){ e.preventDefault(); addNote(); } }});
    const addNote = ()=>{
      const t=input.value.trim(); if(!t) return;
      const nt={id:uid(),text:t,done:false}; ev.notes=ev.notes||[]; ev.notes.push(nt); persist();
      notes.append(renderNote(a,ev,nt)); input.value=''; input.focus();
      badge.textContent = allDone(ev)?'✅ To-Do':'☑️ To-Do'; refreshEventNode(ev);
    };
    body.append(notes, el('div',{class:'note-add'}, input, el('button',{title:'Ajouter la tâche',onclick:addNote},'+')));
    body.onchange = ()=>{ badge.textContent = allDone(ev)?'✅ To-Do':'☑️ To-Do'; refreshEventNode(ev); };
  }

  document.getElementById('ev-backdrop').classList.remove('hidden');
  setTimeout(()=>{ const f = isDoc ? body.querySelector('textarea') : ti; if(f) f.focus(); },80);
}
function closeEventModal(){
  persist();
  const ev = evEditing && evEditing.ev;
  document.getElementById('ev-backdrop').classList.add('hidden');
  if(ev) refreshEventNode(ev);
  evEditing=null;
}
function deleteEventFromModal(){
  if(!evEditing) return;
  if(!confirm('Supprimer cet événement ?')) return;
  const {a,ev}=evEditing;
  a.events=a.events.filter(x=>x.id!==ev.id); persist();
  const lane=document.querySelector(`.lane[data-id="${a.id}"]`);
  const track=lane && lane.querySelector('.track');
  const node=track && track.querySelector(`.event-node[data-id="${ev.id}"]`);
  if(node) node.remove();
  if(track && (!a.events||a.events.length===0)) track.classList.add('empty');
  document.getElementById('ev-backdrop').classList.add('hidden'); evEditing=null;
}

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function printEvent(){
  if(!evEditing) return;
  const {a,ev}=evEditing;
  const title = eventTitle(ev), date = fmtTs(ev.ts), affaire = a.nom||'';
  let inner;
  if(ev.type==='doc'){
    inner = `<div class="doc">${ev.text||''}</div>`;
  }else{
    const items=(ev.notes||[]).map(n=>
      `<li class="${n.done?'done':''}"><span class="box">${n.done?'☑':'☐'}</span> ${escapeHtml(n.text)}</li>`).join('');
    inner = `<ul class="todo">${items||'<li>(aucune tâche)</li>'}</ul>`;
  }
  const doc = `<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><title>${escapeHtml(title)}</title>
    <style>
      *{box-sizing:border-box}
      body{font-family:-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:#111;margin:26px;line-height:1.55}
      h1{font-size:21px;margin:0 0 4px}
      .meta{color:#555;font-size:12px;margin-bottom:18px;border-bottom:1px solid #ddd;padding-bottom:10px}
      .doc{white-space:pre-wrap;font-size:13.5px}
      ul.todo{list-style:none;padding:0;margin:0}
      ul.todo li{padding:5px 0;font-size:14px}
      ul.todo li.done{color:#777;text-decoration:line-through}
      .box{display:inline-block;width:1.3em}
      @media print{@page{margin:16mm}}
    </style></head><body>
      <h1>${escapeHtml(title)}</h1>
      <div class="meta">${escapeHtml(affaire)} — ${escapeHtml(date)}</div>
      ${inner}
    </body></html>`;
  const ifr=document.createElement('iframe');
  ifr.setAttribute('aria-hidden','true');
  ifr.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(ifr);
  const d=ifr.contentWindow.document; d.open(); d.write(doc); d.close();
  setTimeout(()=>{ try{ ifr.contentWindow.focus(); ifr.contentWindow.print(); }catch(e){} setTimeout(()=>ifr.remove(),800); }, 250);
}

function renderNote(a, ev, nt){
  const cb = el('input',{type:'checkbox'});
  cb.checked = !!nt.done;
  const li = el('li',{class:'note'+(nt.done?' done':'')},
    el('label',{}, cb, el('span',{class:'note-txt'}, nt.text)),
    el('button',{class:'note-del',title:'Supprimer la note',onclick:()=>{
      ev.notes=ev.notes.filter(x=>x.id!==nt.id); persist(); li.remove();
    }},'×')
  );
  cb.addEventListener('change',()=>{ nt.done=cb.checked; persist(); li.classList.toggle('done',nt.done); });
  return li;
}

function addEvent(a, track, type='todo'){
  const ev = {id:uid(), ts:new Date().toISOString(), type, title:''};
  if(type==='doc') ev.text=''; else ev.notes=[];
  a.events = a.events||[]; a.events.push(ev); persist();
  track.classList.remove('empty');
  const node = renderEventNode(a, ev);
  track.insertBefore(node, track.querySelector('.add-node'));
  track.scrollTo({left:track.scrollWidth, behavior:'smooth'});
  openEventModal(a, ev);
}

/* menu flottant : Nouvelle To-Do / Nouveau Document */
function closeEventMenu(){ const m=document.querySelector('.evt-menu'); if(m) m.remove(); }
function openEventMenu(anchorEl, a, track){
  closeEventMenu();
  const menu = el('div',{class:'evt-menu'},
    el('button',{class:'evt-menu-item',onclick:()=>{ closeEventMenu(); addEvent(a,track,'todo'); }},
      el('span',{class:'emi-ic todo'},'☑️'),
      el('div',{}, el('b',{},'Nouvelle To-Do'), el('span',{class:'emi-sub'},'liste de tâches à cocher'))),
    el('button',{class:'evt-menu-item',onclick:()=>{ closeEventMenu(); addEvent(a,track,'doc'); }},
      el('span',{class:'emi-ic doc'},'📋'),
      el('div',{}, el('b',{},'Nouveau Document'), el('span',{class:'emi-sub'},'texte libre / copier-coller')))
  );
  document.body.append(menu);
  const r=anchorEl.getBoundingClientRect(), mw=menu.offsetWidth, mh=menu.offsetHeight;
  let left=r.left, top=r.bottom+6;
  if(top+mh>innerHeight-8) top=r.top-mh-6;
  if(left+mw>innerWidth-8) left=innerWidth-mw-8;
  menu.style.left=Math.max(8,left)+'px'; menu.style.top=Math.max(8,top)+'px';
  setTimeout(()=>document.addEventListener('click',closeEventMenu,{once:true}),0);
}

function deleteAffaire(a){
  if(!confirm(`Supprimer l'affaire « ${a.nom} » et tout son suivi ?`)) return;
  affaires = affaires.filter(x=>x.id!==a.id); persist();
  const lane = board.querySelector(`.lane[data-id="${a.id}"]`);

/* ---------- Mini-carte dans la fiche ---------- */
function toggleMiniMap(e, a){
  const lane = e.target.closest('.lane');
  const box = lane.querySelector('.map-mini');
  if(!box) return;
  box.classList.toggle('hidden');
  if(box.classList.contains('hidden')) return;
  if(box._map) { setTimeout(()=>box._map.invalidateSize(),0); return; }
  if(!window.L){ box.textContent='Carte indisponible (Leaflet non chargé).'; return; }
  const m = L.map(box,{attributionControl:false,zoomControl:true}).setView([a.adresse.lat,a.adresse.lng],15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(m);
  L.marker([a.adresse.lat,a.adresse.lng],{icon:pinIcon(pinColor(a.etat,a.repondu,a.avalider), pinSymbol(a))}).addTo(m);
  box._map = m;
  setTimeout(()=>m.invalidateSize(),0);
}

/* ============================================================================
   MODALE — création / édition

const backdrop = document.getElementById('backdrop');
let editing = null;        // affaire en cours d'édition (ou null = création)
let modalMap=null, modalMarker=null, modalCoords={lat:null,lng:null};
const $ = id => document.getElementById(id);

function openModal(a=null){
  editing = a;
  $('modal-title').textContent = a ? "Modifier l'affaire" : "Nouvelle affaire";
  $('f-etat').value    = a?.etat || "Appel d'offre";

function closeModal(){
  backdrop.classList.add('hidden');
  if(modalMap){ modalMap.remove(); modalMap=null; modalMarker=null; }
}

function updateCoordsLabel(){
  $('f-coords').textContent = modalCoords.lat!=null
    ? `Point : ${modalCoords.lat.toFixed(5)}, ${modalCoords.lng.toFixed(5)}`
    : 'Aucun point posé.';
}

function modalIcon(){
  const etat=$('f-etat').value, rep=$('f-repondu').checked, av=$('f-avalider').checked;
  let sym=null;
  if(av) sym='🔍';
  else if(etat==='En travaux') sym='🏗️';
  else if(etat==='Terminé') sym='💵';
  else if(etat==='Sans suite') sym='♻️';
  else if(etat==='En étude') sym='⚙️';
  else if(rep) sym='🕑';
  else if(etat==="Appel d'offre") sym='📥';
  return pinIcon(pinColor(etat,rep,av), sym);
}

function setMarker(lat,lng,recenter=false){
  modalCoords={lat,lng}; updateCoordsLabel();
  if(!modalMap) return;
  const icon = modalIcon();
  if(modalMarker) modalMarker.setLatLng([lat,lng]).setIcon(icon);
  else modalMarker=L.marker([lat,lng],{icon}).addTo(modalMap);
  if(recenter) modalMap.setView([lat,lng],16);
}

function initModalMap(){
  const box = $('modal-map');
  if(!window.L){
    box.outerHTML = '<div class="map-fallback" id="modal-map">Carte OpenStreetMap indisponible (Leaflet non chargé — vérifiez la connexion).<br>Vous pouvez enregistrer l\'affaire sans point.</div>';
    return;
  }
  const start = modalCoords.lat!=null ? [modalCoords.lat,modalCoords.lng] : [44.559, 6.079]; // Gap par défaut
  modalMap = L.map(box).setView(start, modalCoords.lat!=null?15:12);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(modalMap);
  if(modalCoords.lat!=null){ modalMarker=L.marker(start,{icon:modalIcon()}).addTo(modalMap); }
  modalMap.on('click', e=>{
    setMarker(e.latlng.lat, e.latlng.lng);
    if(!$('f-adresse').value.trim()) reverseGeocode(e.latlng.lat,e.latlng.lng);
  });
  setTimeout(()=>modalMap.invalidateSize(),80);
}

/* ---------- Géocodage Nominatim (OSM) ---------- */
async function geocodeAddress(){
  const q = $('f-adresse').value.trim();
  if(!q){ toast("Saisissez d'abord une adresse."); return; }
  const btn = $('f-geoloc'); btn.disabled=true; const old=btn.textContent; btn.textContent='Recherche…';
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`,
      {headers:{'Accept':'application/json'}});
    const data = await r.json();
    if(data && data[0]){ setMarker(parseFloat(data[0].lat), parseFloat(data[0].lon), true); }
    else toast('Adresse introuvable — posez le point à la main.');
  }catch(e){ toast('Géocodage indisponible — posez le point à la main.'); }
  finally{ btn.disabled=false; btn.textContent=old; }
}
async function reverseGeocode(lat,lng){
  try{
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lng}`,
      {headers:{'Accept':'application/json'}});
    const data = await r.json();
    if(data && data.display_name && !$('f-adresse').value.trim()) $('f-adresse').value = data.display_name;
  }catch(e){/* silencieux */}
}

function saveModal(){
  const nom = $('f-nom').value.trim();
  if(!nom){ $('err-nom').hidden=false; $('f-nom').focus(); return; }
  const data = {
    etat: $('f-etat').value,
    nom,
    echeance: $('f-echeance').value || null,
    repondu: $('f-repondu').checked,
    avalider: $('f-avalider').checked,
    adresse: {
      text: $('f-adresse').value.trim(),
      lat: modalCoords.lat, lng: modalCoords.lng
    },
    client: {
      entreprise:$('f-ent').value.trim(),
      contact:$('f-contact').value.trim(),
      tel:$('f-tel').value.trim(),
      mail:$('f-mail').value.trim()
    }
  };
  if(editing){
    Object.assign(editing, data); persist(); toast('Affaire mise à jour');
  }else{
    affaires.push({id:uid(), ...data, events:[]}); persist(); toast('Affaire créée');
  }
  upsertClientFromAffaire(data.client);
  renderContacts();
  closeModal(); renderAll();
  if(currentView==='map') renderOverview();
  if(currentView==='agenda') renderAgenda();
}

function exportJSON(){
  const blob = new Blob([JSON.stringify(affaires,null,2)],{type:'application/json'});
  const d = new Date(), p=n=>String(n).padStart(2,'0');
  const a = el('a',{href:URL.createObjectURL(blob),
    download:`momotion-flow-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`});
  document.body.append(a); a.click(); a.remove();
}
function importJSON(file){
  const reader = new FileReader();
  reader.onload = ()=>{
    try{
      const data = JSON.parse(reader.result);
      if(!Array.isArray(data)) throw new Error('format');
      if(!confirm(`Importer ${data.length} affaire(s) ? Cela remplacera les données actuelles.`)) return;
      affaires = data; persist(); renderAll(); if(currentView==='map') renderOverview(); if(currentView==='agenda') renderAgenda(); toast('Import réussi');
    }catch(e){ toast('Fichier JSON invalide.'); }
  };
  reader.readAsText(file);
}

function manualBackup(){
  const blob=new Blob([backupPayload()],{type:'application/json'});
  const d=new Date(),p=n=>String(n).padStart(2,'0');
  const a=el('a',{href:URL.createObjectURL(blob),download:`momotion-${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}.json`});
  document.body.append(a); a.click(); a.remove(); dirty=false; toast('Sauvegarde téléchargée');
}
function loadBackupFile(file){
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const data=JSON.parse(reader.result);
      const aff = Array.isArray(data) ? data : data.affaires;
      if(!Array.isArray(aff) && !data.tools && !data.contacts) throw new Error('format');
      if(!confirm('Charger cette sauvegarde ? Les données actuelles seront remplacées.')) return;
      if(Array.isArray(aff)){ affaires=aff; persist(); }
      if(data.tools){ tools=data.tools; saveTools(); }
      if(data.contacts){ const c=data.contacts; c.clients=c.clients||[]; c.sous_traitants=c.sous_traitants||[]; contacts=c; saveContacts(); }
      dirty=false; toast('Sauvegarde chargée'); setTimeout(()=>location.reload(),400);
    }catch(e){ toast('Fichier JSON invalide.'); }
  };
  reader.readAsText(file);
}

}

/* ============================================================================
   VUE CARTE GLOBALE — toutes les affaires géolocalisées
   ============================================================================ */
let currentView='board';
let overviewMap=null, overviewLayer=null;
let drawLayer=null, drawTool=null, drawTemp=null, freeDrawing=false, drawToolbarEl=null;
const drawIdLayers={};

/* ---------- Outils de dessin & mesure sur la carte ---------- */
function llLen(lls){ let d=0; for(let i=1;i<lls.length;i++) d+=overviewMap.distance(lls[i-1],lls[i]); return d; }
function fmtDist(m){ return m<1000 ? (Math.round(m*10)/10)+' m' : (m/1000).toFixed(3)+' km'; }
function polyArea(lls){
  const R=6378137, n=lls.length; if(n<3) return 0; let s=0;
  for(let i=0;i<n;i++){ const p1=lls[i], p2=lls[(i+1)%n];
    s += (p2.lng-p1.lng)*Math.PI/180 * (2 + Math.sin(p1.lat*Math.PI/180) + Math.sin(p2.lat*Math.PI/180)); }
  return Math.abs(s*R*R/2);
}
function fmtArea(a){ return Math.round(a).toLocaleString('fr-FR')+' m²'; }
function dedupeLL(lls){ const o=[]; for(const p of lls){ const l=o[o.length-1]; if(!l||l.lat!==p.lat||l.lng!==p.lng) o.push(p); } return o; }

function buildDrawFeature(f){
  const lls=f.pts.map(p=>L.latLng(p[0],p[1]));
  let layer;
  if(f.type==='draw') layer=L.polyline(lls,{color:'#DC2626',weight:3,opacity:.9});
  else if(f.type==='ruler'||f.type==='poly') layer=L.polyline(lls,{color:'#1D4ED8',weight:3});
  else layer=L.polygon(lls,{color:'#16A34A',weight:2,fillColor:'#16A34A',fillOpacity:.15});
  if(f.type==='ruler'||f.type==='poly') layer.bindTooltip(fmtDist(llLen(lls)),{permanent:true,direction:'center',className:'measure-label'});
  else if(f.type==='area') layer.bindTooltip(fmtArea(polyArea(lls)),{permanent:true,direction:'center',className:'measure-label'});
  layer.on('click',ev=>{ if(drawTool==='erase'){ L.DomEvent.stop(ev); removeDrawing(f.id); } });
  drawLayer.addLayer(layer); drawIdLayers[f.id]=layer;
}
function addDrawing(type,lls){ const f={id:uid(),type,pts:lls.map(l=>[l.lat,l.lng])}; drawings.push(f); saveDrawings(); buildDrawFeature(f); }
function removeDrawing(id){ const l=drawIdLayers[id]; if(l&&drawLayer) drawLayer.removeLayer(l); delete drawIdLayers[id]; drawings=drawings.filter(f=>f.id!==id); saveDrawings(); }
function clearDrawings(){ drawings=[]; saveDrawings(); if(drawLayer) drawLayer.clearLayers(); for(const k in drawIdLayers) delete drawIdLayers[k]; }

function cancelDrawTemp(){ if(drawTemp){ if(drawTemp.line) overviewMap.removeLayer(drawTemp.line); if(drawTemp.poly) overviewMap.removeLayer(drawTemp.poly); drawTemp=null; } freeDrawing=false; }
function setDrawTool(t){
  drawTool=(drawTool===t)?null:t; cancelDrawTemp();
  if(drawToolbarEl) drawToolbarEl.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.tool===drawTool));
  if(!overviewMap) return;
  const c=overviewMap.getContainer();
  if(drawTool){ overviewMap.doubleClickZoom.disable(); c.style.cursor='crosshair'; } else { overviewMap.doubleClickZoom.enable(); c.style.cursor=''; }
  if(drawTool==='draw') overviewMap.dragging.disable(); else overviewMap.dragging.enable();
}
function onDrawMouseDown(e){ if(drawTool!=='draw') return; freeDrawing=true; drawTemp={latlngs:[e.latlng], line:L.polyline([e.latlng],{color:'#DC2626',weight:3}).addTo(overviewMap)}; }
function onDrawMouseMove(e){
  if(freeDrawing && drawTemp){ drawTemp.latlngs.push(e.latlng); drawTemp.line.setLatLngs(drawTemp.latlngs); return; }
  if(!drawTemp) return;
  if(drawTool==='ruler'||drawTool==='poly') drawTemp.line.setLatLngs(drawTemp.latlngs.concat([e.latlng]));
  else if(drawTool==='area') drawTemp.poly.setLatLngs(drawTemp.latlngs.concat([e.latlng]));
}
function onDrawMouseUp(){
  if(!freeDrawing) return; freeDrawing=false;
  const pts=drawTemp?drawTemp.latlngs:[];
  if(drawTemp){ overviewMap.removeLayer(drawTemp.line); drawTemp=null; }
  if(pts.length>1) addDrawing('draw', pts);
}
function onDrawClick(e){
  if(!drawTool || drawTool==='draw' || drawTool==='erase') return;
  if(drawTool==='ruler'){
    if(!drawTemp) drawTemp={latlngs:[e.latlng], line:L.polyline([e.latlng],{color:'#1D4ED8',weight:3,dashArray:'6 5'}).addTo(overviewMap)};
    else { drawTemp.latlngs.push(e.latlng); const pts=drawTemp.latlngs.slice(0,2); overviewMap.removeLayer(drawTemp.line); drawTemp=null; addDrawing('ruler', pts); }
  } else if(drawTool==='poly'){
    if(!drawTemp) drawTemp={latlngs:[e.latlng], line:L.polyline([e.latlng],{color:'#1D4ED8',weight:3}).addTo(overviewMap)};
    else { drawTemp.latlngs.push(e.latlng); drawTemp.line.setLatLngs(drawTemp.latlngs); }
  } else if(drawTool==='area'){
    if(!drawTemp) drawTemp={latlngs:[e.latlng], poly:L.polygon([e.latlng],{color:'#16A34A',weight:2,fillOpacity:.15}).addTo(overviewMap)};
    else { drawTemp.latlngs.push(e.latlng); drawTemp.poly.setLatLngs(drawTemp.latlngs); }
  }
}
function onDrawDblClick(e){
  if(drawTool==='poly' && drawTemp){ const pts=dedupeLL(drawTemp.latlngs); overviewMap.removeLayer(drawTemp.line); drawTemp=null; if(pts.length>=2) addDrawing('poly', pts); }
  else if(drawTool==='area' && drawTemp){ const pts=dedupeLL(drawTemp.latlngs); overviewMap.removeLayer(drawTemp.poly); drawTemp=null; if(pts.length>=3) addDrawing('area', pts); }
  else if(drawTool==='erase'){ if(drawings.length && confirm('Effacer tous les tracés ?')) clearDrawings(); }
}
const DRAW_TOOLS=[
  {t:'draw', title:'Dessiner à main levée', svg:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'},
  {t:'ruler',title:'Cote linéaire (2 points)', svg:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 20 4"/><path d="m6 14 2 2"/><path d="m10 10 2 2"/><path d="m14 6 2 2"/></svg>'},
  {t:'poly', title:'Ligne brisée — double-clic pour finir', svg:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 18l5-8 4 5 4-9 5 8"/></svg>'},
  {t:'area', title:'Aire — double-clic pour finir', svg:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5l14 3-4 11-8-2Z"/></svg>'},
  {t:'erase',title:'Gomme — clic sur un tracé ; double-clic sur la carte = tout effacer', svg:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m7 21-4-4a2 2 0 0 1 0-2.83l8-8a2 2 0 0 1 2.83 0l4 4a2 2 0 0 1 0 2.83L14 21Z"/><path d="M22 21H8"/></svg>'}
];
function initDrawTools(map, ctrl){
  drawLayer=L.featureGroup().addTo(map);
  if(ctrl) ctrl.addOverlay(drawLayer,'Annotations');
  drawings.forEach(buildDrawFeature);
  const Ctrl=L.Control.extend({options:{position:'topright'}, onAdd:function(){
    const div=L.DomUtil.create('div','map-tools');
    div.innerHTML=DRAW_TOOLS.map(b=>`<button data-tool="${b.t}" title="${b.title}">${b.svg}</button>`).join('');
    L.DomEvent.disableClickPropagation(div); L.DomEvent.disableScrollPropagation(div);
    div.querySelectorAll('button').forEach(btn=>btn.onclick=()=>setDrawTool(btn.dataset.tool));
    drawToolbarEl=div; return div;
  }});
  map.addControl(new Ctrl());
  map.on('mousedown', onDrawMouseDown);
  map.on('mousemove', onDrawMouseMove);
  map.on('mouseup', onDrawMouseUp);
  map.on('click', onDrawClick);
  map.on('dblclick', onDrawDblClick);
}

function setView(v){
  currentView=v;
  document.querySelectorAll('.viewtoggle .vt').forEach(b=>b.classList.toggle('on', b.dataset.view===v));
